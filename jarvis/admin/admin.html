<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis — console administrateur</title>
<style>
  /* Palette alignee sur le dashboard (scripts/dashboard_utils.py). */
  :root{
    --ocean:#1D1864; --indigo:#4F46E5; --turquoise:#0EA5E9; --corail:#F43F5E;
    --bg:#0F172A; --surface:#1E293B; --text:#F1F5F9; --muted:#94A3B8;
    --border:#334155;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);
    font:14px/1.55 Inter,-apple-system,Segoe UI,Roboto,sans-serif}
  a{color:var(--turquoise)}

  /* --- Connexion --- */
  #connexion{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
  .carte{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);
    border-radius:16px;padding:28px}
  .marque{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .pastille{width:34px;height:34px;border-radius:10px;flex:none;
    background:linear-gradient(135deg,var(--indigo),var(--turquoise))}
  h1{font-size:17px;margin:0;font-weight:650}
  .sous{color:var(--muted);font-size:12.5px;margin:2px 0 22px}
  label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
  input[type=password]{width:100%;padding:11px 12px;border-radius:10px;
    border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px}
  input[type=password]:focus{outline:none;border-color:var(--indigo)}
  button{width:100%;margin-top:14px;padding:11px;border:0;border-radius:10px;cursor:pointer;
    background:var(--indigo);color:#fff;font-size:14px;font-weight:600}
  button:disabled{opacity:.55;cursor:default}
  .erreur{margin-top:14px;padding:10px 12px;border-radius:10px;font-size:12.5px;
    background:rgba(244,63,94,.12);border:1px solid rgba(244,63,94,.35);color:#FDA4AF;display:none}
  .erreur.on{display:block}

  /* --- Console --- */
  #console{display:none;height:100%;flex-direction:column}
  header{display:flex;align-items:center;gap:12px;padding:12px 18px;
    border-bottom:1px solid var(--border);background:var(--surface)}
  header .pastille{width:26px;height:26px;border-radius:8px}
  header h1{font-size:14px}
  .etat{margin-left:auto;display:flex;align-items:center;gap:14px;color:var(--muted);font-size:12px}
  .lien{background:none;border:0;color:var(--muted);cursor:pointer;font-size:12px;
    text-decoration:underline;width:auto;margin:0;padding:0;font-weight:400}
  #fil{flex:1;overflow-y:auto;padding:22px 18px}
  .enveloppe{max-width:780px;margin:0 auto}
  .msg{margin-bottom:16px;padding:12px 15px;border-radius:12px;white-space:pre-wrap;
    overflow-wrap:anywhere}
  .msg.moi{background:var(--indigo);color:#fff;margin-left:auto;max-width:82%;
    border-bottom-right-radius:5px}
  .msg.bot{background:var(--surface);border:1px solid var(--border);
    border-bottom-left-radius:5px}
  .msg.bot code{background:rgba(148,163,184,.16);padding:1px 5px;border-radius:5px;
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
  /* Le prompt admin autorise titres, listes et tableaux: la console doit
     savoir les afficher, sinon elle rend du Markdown brut. */
  .msg.bot{white-space:normal}
  /* Figures (Phase 8): rendues sur le fond des bulles (#1E293B, theme sombre). */
  .fig{max-width:560px;margin:0 0 16px;padding:12px 14px 9px;background:var(--surface);border:1px solid var(--border);border-radius:12px}
  .fig figcaption{font-size:13px;margin-bottom:8px}
  .fig figcaption strong{display:block}
  .fig figcaption span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
  .fig-img{color:var(--muted);font-size:12.5px;min-height:40px}
  .fig-img img{display:block;width:100%;height:auto;border-radius:8px}
  .fig-liens{text-align:right;margin-top:6px}
  .fig-liens button{background:none;border:0;color:var(--turquoise);font-size:12px;cursor:pointer;text-decoration:underline;padding:0}
  .msg.bot h1,.msg.bot h2,.msg.bot h3{margin:16px 0 8px;font-weight:650;line-height:1.3}
  .msg.bot h1{font-size:16px} .msg.bot h2{font-size:15px} .msg.bot h3{font-size:14px}
  .msg.bot h1:first-child,.msg.bot h2:first-child,.msg.bot h3:first-child{margin-top:0}
  .msg.bot p{margin:0 0 10px} .msg.bot p:last-child{margin-bottom:0}
  .msg.bot ul,.msg.bot ol{margin:0 0 10px;padding-left:22px}
  .msg.bot li{margin-bottom:4px}
  .msg.bot pre{background:var(--bg);border:1px solid var(--border);border-radius:10px;
    padding:11px 13px;overflow-x:auto;margin:0 0 10px}
  .msg.bot pre code{background:none;padding:0;font-size:12.5px}
  .tableau{overflow-x:auto;margin:0 0 12px}
  .msg.bot table{border-collapse:collapse;font-size:13px;width:auto;min-width:50%}
  .msg.bot th,.msg.bot td{border:1px solid var(--border);padding:6px 11px;text-align:left}
  .msg.bot th{background:rgba(148,163,184,.10);font-weight:600}
  .msg.bot tbody tr:nth-child(even){background:rgba(148,163,184,.04)}
  .outil{color:var(--muted);font-size:12px;font-style:italic;margin-bottom:14px;
    display:flex;align-items:center;gap:7px}
  .outil s{width:7px;height:7px;border-radius:50%;background:var(--turquoise);
    animation:clign 1.1s infinite;flex:none}
  @keyframes clign{0%,100%{opacity:.25}50%{opacity:1}}
  .vide{color:var(--muted);text-align:center;padding:40px 0;font-size:13px}

  /* Carte d'approbation: Jarvis propose, c'est ici que l'utilisateur decide.
     Volontairement distincte d'un message, pour qu'on ne clique pas par
     habitude en lisant une reponse. */
  .action{border:1px solid var(--indigo);border-radius:12px;margin-bottom:16px;
    background:rgba(79,70,229,.07);overflow:hidden}
  .action-tete{padding:11px 15px;border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600}
  .action-tete b{color:var(--turquoise);font-weight:600}
  .action-corps{padding:13px 15px;font-size:13px}
  .action-raison{color:var(--muted);margin-bottom:11px}
  .diff{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;
    background:var(--bg);border:1px solid var(--border);border-radius:8px;
    padding:9px 11px;margin-bottom:9px;overflow-x:auto;white-space:pre-wrap;
    overflow-wrap:anywhere}
  .diff .sup{color:#FDA4AF} .diff .add{color:#6EE7B7}
  .action-pied{padding:11px 15px;border-top:1px solid var(--border);
    display:flex;gap:10px;align-items:center}
  .action-pied .delai{margin-left:auto;color:var(--muted);font-size:11.5px}
  .bouton{width:auto;margin:0;padding:8px 16px;font-size:13px}
  .bouton.refuser{background:transparent;border:1px solid var(--border);color:var(--muted)}
  .action.traitee{opacity:.75;border-color:var(--border)}
  .diff .meta{color:var(--muted)}
  .diff-code{max-height:340px;white-space:pre;overflow:auto}
  .sortie{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;margin:8px 0 0;
    background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 10px;
    max-height:260px;overflow:auto;white-space:pre-wrap;color:var(--text)}
  .action-bilan .lien{background:none;border:0;padding:0;margin-left:8px;cursor:pointer;
    color:var(--corail);text-decoration:underline;font-size:12.5px}
  .action-bilan{padding:11px 15px;font-size:12.5px;color:var(--muted)}
  footer{border-top:1px solid var(--border);background:var(--surface);padding:12px 18px}
  .saisie{max-width:780px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
  textarea{flex:1;resize:none;max-height:180px;padding:11px 13px;border-radius:12px;
    border:1px solid var(--border);background:var(--bg);color:var(--text);
    font:14px/1.5 inherit}
  textarea:focus{outline:none;border-color:var(--indigo)}
  .envoyer{width:auto;margin:0;padding:11px 18px}
</style>

<div id="connexion">
  <form class="carte" id="formulaire">
    <div class="marque"><div class="pastille"></div><h1>Jarvis — console administrateur</h1></div>
    <p class="sous">CLIMAT-SEN · accès réservé</p>
    <label for="mdp">Mot de passe</label>
    <input type="password" id="mdp" autocomplete="current-password" autofocus>
    <button type="submit" id="valider">Se connecter</button>
    <div class="erreur" id="erreur"></div>
  </form>
</div>

<div id="console">
  <header>
    <div class="pastille"></div>
    <h1>Jarvis — console administrateur</h1>
    <div class="etat">
      <span id="modele"></span>
      <button class="lien" id="deconnexion">Se déconnecter</button>
    </div>
  </header>
  <div id="fil"><div class="enveloppe" id="messages">
    <p class="vide">Session ouverte. Les outils de lecture des données et des documents sont disponibles.</p>
  </div></div>
  <footer><div class="saisie">
    <textarea id="saisie" rows="1" placeholder="Votre question…"></textarea>
    <button class="envoyer" id="envoyer">Envoyer</button>
  </div></footer>
</div>

<script>
(function(){
  "use strict";
  var API = "__JARVIS_API_BASE__";
  var CLE = "jarvis_admin_token";
  var etat = {jeton:null, conv:null, occupe:false};

  function $(id){ return document.getElementById(id); }
  function retenir(v){ try{ v ? sessionStorage.setItem(CLE, v) : sessionStorage.removeItem(CLE); }catch(e){} }
  function relire(){ try{ return sessionStorage.getItem(CLE); }catch(e){ return null; } }

  function entetes(){
    return {"Content-Type":"application/json", "X-Jarvis-Session": etat.jeton || ""};
  }

  function echapper(t){
    return String(t).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  /* Rendu Markdown: titres, listes, tableaux, blocs de code, gras.
     Le prompt admin autorise ces formes; sans ce rendu, la console affichait
     des lignes de tableau brutes.

     TOUT est echappe AVANT d'etre assemble: une reponse du modele ne peut
     donc pas injecter de balise, ni dans le texte, ni dans une cellule. */
  function enligne(t){
    return echapper(t)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  }

  function cellules(ligne){
    var brut = ligne.trim().replace(/^\|/, "").replace(/\|$/, "");
    return brut.split("|").map(function(c){ return c.trim(); });
  }
  function estSeparateur(ligne){
    return /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(ligne) && ligne.indexOf("-") !== -1;
  }

  function mini(md){
    var lignes = String(md).split("\n");
    var sortie = [], i = 0;

    while(i < lignes.length){
      var l = lignes[i];

      /* bloc de code */
      if(/^\s*```/.test(l)){
        var code = [];
        i++;
        while(i < lignes.length && !/^\s*```/.test(lignes[i])){ code.push(lignes[i]); i++; }
        i++;
        sortie.push("<pre><code>" + echapper(code.join("\n")) + "</code></pre>");
        continue;
      }

      /* tableau: une ligne de cellules suivie d'une ligne de separation */
      if(l.indexOf("|") !== -1 && i + 1 < lignes.length && estSeparateur(lignes[i + 1])){
        var entetes = cellules(l);
        i += 2;
        var corps = [];
        while(i < lignes.length && lignes[i].indexOf("|") !== -1 && lignes[i].trim()){
          corps.push(cellules(lignes[i])); i++;
        }
        var html = "<div class=\"tableau\"><table><thead><tr>";
        entetes.forEach(function(c){ html += "<th>" + enligne(c) + "</th>"; });
        html += "</tr></thead><tbody>";
        corps.forEach(function(ligneCells){
          html += "<tr>";
          ligneCells.forEach(function(c){ html += "<td>" + enligne(c) + "</td>"; });
          html += "</tr>";
        });
        sortie.push(html + "</tbody></table></div>");
        continue;
      }

      /* titre */
      var titre = /^(#{1,3})\s+(.*)$/.exec(l);
      if(titre){
        var n = titre[1].length;
        sortie.push("<h" + n + ">" + enligne(titre[2]) + "</h" + n + ">");
        i++;
        continue;
      }

      /* liste a puces ou numerotee */
      if(/^\s*([-*+]|\d+[.)])\s+/.test(l)){
        var numerotee = /^\s*\d+[.)]\s+/.test(l);
        var items = [];
        while(i < lignes.length && /^\s*([-*+]|\d+[.)])\s+/.test(lignes[i])){
          items.push(lignes[i].replace(/^\s*([-*+]|\d+[.)])\s+/, ""));
          i++;
        }
        var balise = numerotee ? "ol" : "ul";
        sortie.push("<" + balise + ">" +
          items.map(function(it){ return "<li>" + enligne(it) + "</li>"; }).join("") +
          "</" + balise + ">");
        continue;
      }

      /* paragraphe: lignes consecutives non vides */
      if(l.trim()){
        var para = [];
        while(i < lignes.length && lignes[i].trim()
              && !/^(#{1,3})\s+/.test(lignes[i])
              && !/^\s*([-*+]|\d+[.)])\s+/.test(lignes[i])
              && !/^\s*```/.test(lignes[i])
              && !(lignes[i].indexOf("|") !== -1 && i + 1 < lignes.length
                   && estSeparateur(lignes[i + 1]))){
          para.push(lignes[i]); i++;
        }
        sortie.push("<p>" + enligne(para.join("\n")).replace(/\n/g, "<br>") + "</p>");
        continue;
      }
      i++;
    }
    return sortie.join("");
  }

  function bulle(role, texte){
    var vide = $("messages").querySelector(".vide");
    if(vide){ vide.remove(); }
    var el = document.createElement("div");
    el.className = "msg " + role;
    if(role === "bot"){ el.innerHTML = mini(texte); } else { el.textContent = texte; }
    $("messages").appendChild(el);
    defiler();
    return el;
  }
  function defiler(){ var f = $("fil"); f.scrollTop = f.scrollHeight; }

  /* ---------- Figures (Phase 8) ----------
     Image telechargee par fetch (le jeton passe en en-tete), puis affichee
     en URL data:, autorisee par la CSP (img-src 'self' data:). */
  function figure(ref){
    if(!ref || !ref.id){ return; }
    var fig = document.createElement("figure");
    fig.className = "fig";
    var leg = document.createElement("figcaption");
    var t = document.createElement("strong"); t.textContent = ref.titre || "Figure";
    leg.appendChild(t);
    if(ref.sous_titre){ var st = document.createElement("span"); st.textContent = ref.sous_titre; leg.appendChild(st); }
    var cadre = document.createElement("div"); cadre.className = "fig-img";
    cadre.textContent = "Chargement de la figure…";
    var liens = document.createElement("div"); liens.className = "fig-liens";
    var csv = document.createElement("button"); csv.type = "button"; csv.textContent = "Données (CSV)";
    csv.addEventListener("click", function(){ csvFigure(ref); });
    liens.appendChild(csv);
    fig.appendChild(leg); fig.appendChild(cadre); fig.appendChild(liens);
    $("messages").appendChild(fig);
    defiler();
    fetch(API + "/api/figures/" + encodeURIComponent(ref.id) + "?theme=sombre", {headers: entetes()})
      .then(function(r){ if(!r.ok){ throw new Error("HTTP " + r.status); } return r.blob(); })
      .then(function(b){
        return new Promise(function(ok, ko){
          var l = new FileReader(); l.onload = function(){ ok(l.result); }; l.onerror = ko; l.readAsDataURL(b);
        });
      })
      .then(function(url){
        cadre.textContent = "";
        var img = document.createElement("img");
        img.alt = (ref.titre || "Figure") + (ref.sous_titre ? " — " + ref.sous_titre : "");
        img.src = url; img.addEventListener("load", defiler);
        cadre.appendChild(img);
      })
      .catch(function(){ cadre.textContent = "Figure indisponible (expirée ou autre session)."; });
  }
  function csvFigure(ref){
    fetch(API + "/api/figures/" + encodeURIComponent(ref.id) + "?format=csv", {headers: entetes()})
      .then(function(r){ if(!r.ok){ throw new Error("HTTP " + r.status); } return r.blob(); })
      .then(function(b){
        var a = document.createElement("a");
        a.href = URL.createObjectURL(b); a.download = "jarvis-figure.csv";
        document.body.appendChild(a); a.click();
        setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      })
      .catch(function(){ bulle("bot", "*Téléchargement impossible.*"); });
  }

  function outil(libelle){
    var el = $("outil-en-cours");
    if(!el){
      el = document.createElement("div");
      el.className = "outil"; el.id = "outil-en-cours";
      $("messages").appendChild(el);
    }
    el.innerHTML = "<s></s><span></span>";
    el.lastChild.textContent = libelle;
    defiler();
  }
  function retirerOutil(){
    var el = $("outil-en-cours");
    if(el){ el.remove(); }
  }

  function montrerConsole(){
    $("connexion").style.display = "none";
    $("console").style.display = "flex";
    $("saisie").focus();
  }
  function montrerConnexion(message){
    $("console").style.display = "none";
    $("connexion").style.display = "flex";
    if(message){ $("erreur").textContent = message; $("erreur").classList.add("on"); }
    $("mdp").value = ""; $("mdp").focus();
  }

  /* ---------- Connexion ---------- */
  $("formulaire").addEventListener("submit", function(e){
    e.preventDefault();
    var mdp = $("mdp").value;
    if(!mdp){ return; }
    $("valider").disabled = true;
    $("erreur").classList.remove("on");
    fetch(API + "/api/admin/login", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({password: mdp})
    }).then(function(r){
      return r.json().then(function(d){ return {ok:r.ok, d:d}; });
    }).then(function(res){
      $("valider").disabled = false;
      $("mdp").value = "";
      if(!res.ok){
        var m = (res.d && res.d.error && res.d.error.message) || "Connexion refusée.";
        $("erreur").textContent = m; $("erreur").classList.add("on");
        return;
      }
      etat.jeton = res.d.token; retenir(etat.jeton);
      montrerConsole();
    }).catch(function(){
      $("valider").disabled = false;
      $("erreur").textContent = "Service injoignable.";
      $("erreur").classList.add("on");
    });
  });

  $("deconnexion").addEventListener("click", function(){
    fetch(API + "/api/admin/logout", {method:"POST", headers: entetes()})
      .catch(function(){})
      .then(function(){
        etat.jeton = null; etat.conv = null; retenir(null);
        $("messages").innerHTML = '<p class="vide">Session fermée.</p>';
        montrerConnexion();
      });
  });

  /* ---------- Envoi + flux SSE ---------- */
  function analyserSSE(brut, surEvenement){
    var blocs = brut.split("\n\n");
    for(var i=0;i<blocs.length;i++){
      var nom = "message", donnees = "";
      var lignes = blocs[i].split("\n");
      for(var j=0;j<lignes.length;j++){
        if(lignes[j].indexOf("event:") === 0){ nom = lignes[j].slice(6).trim(); }
        else if(lignes[j].indexOf("data:") === 0){ donnees += lignes[j].slice(5).trim(); }
      }
      if(donnees){
        try{ surEvenement(nom, JSON.parse(donnees)); }catch(e){}
      }
    }
  }

  function demander(texte){
    if(etat.occupe || !etat.jeton){ return; }
    etat.occupe = true; $("envoyer").disabled = true;
    bulle("moi", texte);
    $("saisie").value = ""; ajuster();

    var corps = {message: texte};
    if(etat.conv){ corps.conversation_id = etat.conv; }
    var cible = null, tampon = "", figures = [];

    fetch(API + "/api/chat", {method:"POST", headers: entetes(), body: JSON.stringify(corps)})
      .then(function(r){
        if(r.status === 401 || r.status === 403){
          etat.jeton = null; retenir(null);
          montrerConnexion("Session expirée. Reconnectez-vous.");
          return null;
        }
        if(!r.ok || !r.body){ throw new Error("HTTP " + r.status); }
        var lecteur = r.body.getReader(), dec = new TextDecoder();
        function pomper(){
          return lecteur.read().then(function(bloc){
            if(bloc.done){
              if(tampon.trim()){ analyserSSE(tampon + "\n\n", traiter); }
              return;
            }
            tampon += dec.decode(bloc.value, {stream:true});
            var coupe = tampon.lastIndexOf("\n\n");
            if(coupe !== -1){
              analyserSSE(tampon.slice(0, coupe + 2), traiter);
              tampon = tampon.slice(coupe + 2);
            }
            return pomper();
          });
        }
        return pomper();
      })
      .catch(function(){
        retirerOutil();
        bulle("bot", "*La réponse n'a pas abouti. Réessayez.*");
      })
      .then(function(){
        retirerOutil();
        figures.forEach(figure);
        etat.occupe = false; $("envoyer").disabled = false;
        // Une proposition a pu etre deposee pendant ce tour: on l'affiche
        // apres la reponse, pour que le contexte soit lu avant de decider.
        rafraichirActions();
      });

    function traiter(nom, d){
      if(nom === "meta"){
        if(d.conversation_id){ etat.conv = d.conversation_id; }
        if(d.model){ $("modele").textContent = d.model; }
      } else if(nom === "figure"){
        figures.push(d);
      } else if(nom === "tool"){
        outil(d.label || "Consultation des données");
      } else if(nom === "delta"){
        retirerOutil();
        if(cible === null){ cible = bulle("bot", ""); cible._brut = ""; }
        cible._brut += d.text;
        cible.innerHTML = mini(cible._brut);
        defiler();
      } else if(nom === "error"){
        retirerOutil();
        bulle("bot", "*" + (d.message || "Erreur.") + "*");
      }
    }
  }

  /* ---------- Saisie ---------- */
  function ajuster(){
    var t = $("saisie");
    t.style.height = "auto";
    t.style.height = Math.min(180, t.scrollHeight) + "px";
  }
  $("saisie").addEventListener("input", ajuster);
  $("saisie").addEventListener("keydown", function(e){
    if(e.key === "Enter" && !e.shiftKey){
      e.preventDefault();
      var v = $("saisie").value.trim();
      if(v){ demander(v); }
    }
  });
  $("envoyer").addEventListener("click", function(){
    var v = $("saisie").value.trim();
    if(v){ demander(v); }
  });

  /* Expose le rendu pour tests/verifier_rendu_admin.py. Fonction pure, sans
     etat ni secret: l'exposer ne donne acces a rien. En contrepartie, le
     rendu -- qui porte l'echappement du HTML -- devient verifiable. */
  window.__rendu = mini;

  /* ---------- Propositions de modification ---------- */
  /* Jarvis ne peut que DEPOSER une proposition. L'ecriture part d'ici, sur un
     clic, vers une route que le modele ne peut pas appeler. */
  var actionsAffichees = {};

  function diffColore(texte){
    return String(texte || "").split("\n").map(function(l){
      var c = (l.indexOf("+++") === 0 || l.indexOf("---") === 0 || l.indexOf("@@") === 0)
        ? "meta" : (l.charAt(0) === "+" ? "add" : (l.charAt(0) === "-" ? "sup" : ""));
      return '<span class="' + c + '">' + echapper(l) + '</span>';
    }).join("\n");
  }

  function contenuAction(a){
    var d = a.details || {};
    var raison = '<div class="action-raison">' + echapper(d.raison || "") + '</div>';
    if(a.type === "code_modifier"){
      return {
        tete: '⚠ Modification du code — <b>' + echapper(d.fichier || "") + '</b>',
        corps: raison + '<div class="diff diff-code">' + diffColore(d.diff) + '</div>' +
          '<div class="action-raison">+' + (d.lignes_ajoutees || 0) + ' / −' +
          (d.lignes_retirees || 0) + ' ligne(s)' + (d.diff_tronque ? ' (diff tronqué)' : '') +
          '. Code compilé avant écriture, sauvegarde horodatée, annulable.</div>',
        bouton: "Appliquer"
      };
    }
    if(a.type === "tache_executer"){
      return {
        tete: '⚠ Exécution — <b>' + echapper(d.cible || "") + '</b>',
        corps: raison + '<div class="action-raison">' + echapper(d.libelle || "") +
          ' · durée max ' + Math.round((d.delai_max_s || 0) / 60) +
          ' min · une tâche à la fois.</div>',
        bouton: "Lancer"
      };
    }
    var diffs = (d.changements || []).slice(0, 3).map(function(c){
      return '<div class="diff"><span class="sup">− ' + echapper(c.avant) +
             '</span>\n<span class="add">+ ' + echapper(c.apres) + '</span></div>';
    }).join("");
    var reste = (d.n_occurrences || 0) - (d.changements || []).length;
    return {
      tete: '⚠ Proposition de modification — <b>' +
            echapper(d.fichier || d.document || "document") + '</b>',
      corps: raison + diffs +
        (reste > 0 ? '<div class="action-raison">… et ' + reste +
                     ' autre(s) occurrence(s) identique(s).</div>' : '') +
        '<div class="action-raison">' + (d.n_occurrences || 0) +
        ' occurrence(s) seront remplacées. Une sauvegarde horodatée est ' +
        'écrite avant modification.</div>',
      bouton: "Appliquer"
    };
  }

  function carteAction(a){
    if(actionsAffichees[a.id]){ return; }
    actionsAffichees[a.id] = true;
    var c = contenuAction(a);
    var el = document.createElement("div");
    el.className = "action";
    el.id = "action-" + a.id;
    el.innerHTML =
      '<div class="action-tete">' + c.tete + '</div>' +
      '<div class="action-corps">' + c.corps + '</div>' +
      '<div class="action-pied">' +
        '<button class="bouton" data-oui="1">' + c.bouton + '</button>' +
        '<button class="bouton refuser" data-non="1">Refuser</button>' +
        '<span class="delai">expire dans ' + Math.round((a.expire_dans || 0)/60) + ' min</span>' +
      '</div>';
    $("messages").appendChild(el);
    if(a.statut === "en_cours"){
      bilan(el, "⏳ En cours…");
      suivreTache(a.id, el);
    } else {
      el.querySelector("[data-oui]").addEventListener("click", function(){ trancher(a, "approve", el); });
      el.querySelector("[data-non]").addEventListener("click", function(){ trancher(a, "reject", el); });
    }
    defiler();
  }

  function bilan(el, html){
    var ancien = el.querySelector(".action-pied, .action-bilan");
    var div = document.createElement("div");
    div.className = "action-bilan";
    div.innerHTML = html;
    if(ancien){ ancien.parentNode.replaceChild(div, ancien); } else { el.appendChild(div); }
    defiler();
    return div;
  }

  function erreurDe(res){
    return echapper((res.d && res.d.error && res.d.error.message) || "Échec.");
  }

  function trancher(a, verdict, el){
    el.querySelectorAll("button").forEach(function(b){ b.disabled = true; });
    fetch(API + "/api/admin/actions/" + encodeURIComponent(a.id) + "/" + verdict,
          {method:"POST", headers: entetes()})
      .then(function(r){ return r.json().then(function(d){ return {ok:r.ok, d:d, status:r.status}; }); })
      .then(function(res){
        if(!res.ok){
          if(res.status === 409 && a.type === "tache_executer"){
            el.querySelectorAll("button").forEach(function(b){ b.disabled = false; });
            bulle("bot", "*" + ((res.d.error && res.d.error.message) || "Tâche non lancée.") + "*");
            return;
          }
          el.classList.add("traitee");
          bilan(el, "✕ " + erreurDe(res));
          return;
        }
        if(verdict === "reject"){
          el.classList.add("traitee");
          bilan(el, "✕ Proposition refusée. Rien n’a été modifié.");
          return;
        }
        var r2 = res.d.resultat || {};
        if(a.type === "tache_executer"){
          bilan(el, "⏳ Lancée — en cours…");
          suivreTache(a.id, el);
        } else if(a.type === "code_modifier"){
          var b = bilan(el, "✔ Appliquée — " + echapper(r2.fichier || "") +
            (r2.sauvegarde ? ". Sauvegarde : " + echapper(r2.sauvegarde) : " (fichier créé)") +
            ' <button class="lien" data-annuler="1">Annuler la modification</button>');
          b.querySelector("[data-annuler]").addEventListener("click", function(){ annuler(a.id, el); });
        } else {
          el.classList.add("traitee");
          bilan(el, "✔ Appliquée — " + (r2.n_occurrences || 0) + " remplacement(s) dans " +
            echapper(r2.fichier || "") + ". Sauvegarde : " + echapper(r2.sauvegarde || ""));
        }
      })
      .catch(function(){
        el.querySelectorAll("button").forEach(function(b){ b.disabled = false; });
      });
  }

  function annuler(id, el){
    var bouton = el.querySelector("[data-annuler]");
    if(bouton){ bouton.disabled = true; }
    fetch(API + "/api/admin/actions/" + encodeURIComponent(id) + "/revert",
          {method:"POST", headers: entetes()})
      .then(function(r){ return r.json().then(function(d){ return {ok:r.ok, d:d}; }); })
      .then(function(res){
        el.classList.add("traitee");
        bilan(el, res.ok ? "↺ Modification annulée : fichier rétabli." : "✕ " + erreurDe(res));
      })
      .catch(function(){ if(bouton){ bouton.disabled = false; } });
  }

  function suivreTache(id, el){
    var essais = 0;
    function tour(){
      essais += 1;
      fetch(API + "/api/admin/actions", {headers: entetes()})
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(function(d){
          var a = d && (d.actions || []).filter(function(x){ return x.id === id; })[0];
          if(!a || a.statut === "en_cours"){
            if(essais < 1200){ setTimeout(tour, 3000); }
            return;
          }
          var r = a.resultat || {};
          el.classList.add("traitee");
          var sortie = String(r.sortie_fin || "").split("\n").slice(-20).join("\n");
          bilan(el, (a.statut === "terminee" ? "✔ Terminée" : "✕ Échec") + " en " +
            (r.duree_s != null ? r.duree_s : "?") + " s" +
            (r.code_retour != null ? " (code " + r.code_retour + ")" : "") +
            (r.erreur ? " — " + echapper(r.erreur) : "") +
            (sortie ? '<pre class="sortie">' + echapper(sortie) + '</pre>' : ""));
        })
        .catch(function(){ setTimeout(tour, 5000); });
    }
    setTimeout(tour, 2000);
  }

  function rafraichirActions(){
    if(!etat.jeton){ return; }
    fetch(API + "/api/admin/actions", {headers: entetes()})
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){
        if(!d){ return; }
        (d.actions || []).forEach(function(a){
          if(a.statut === "en_attente" || a.statut === "en_cours"){ carteAction(a); }
        });
      })
      .catch(function(){});
  }

  /* ---------- Reprise de session ---------- */
  etat.jeton = relire();
  if(etat.jeton){
    fetch(API + "/api/admin/me", {headers: entetes()})
      .then(function(r){
        if(r.ok){ montrerConsole(); }
        else { etat.jeton = null; retenir(null); montrerConnexion(); }
      })
      .catch(function(){ montrerConnexion(); });
  }
})();
</script>
