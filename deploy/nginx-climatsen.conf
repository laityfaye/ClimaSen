server {
    listen 80;
    server_name climatsen.innosft.com;

    # Redirection HTTP -> HTTPS (active apres certbot)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name climatsen.innosft.com;

    # Certificats SSL (generes par certbot)
    ssl_certificate     /etc/letsencrypt/live/climatsen.innosft.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/climatsen.innosft.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Taille max upload (pour les gros fichiers de donnees)
    client_max_body_size 500M;

    # --- Backend Jarvis (assistant IA) ---
    location /jarvis/ {
        # Le serveur autorise 500 Mo pour le dashboard; Jarvis n'en a pas
        # besoin. Une question avec captures de graphiques pese ~1,3 Mo
        # (Phase 9); l'application refuse aussi au-dela de 2,5 Mo.
        client_max_body_size 3m;
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
    
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # $remote_addr et NON $proxy_add_x_forwarded_for : ce dernier CONSERVE
        # l'en-tete envoye par le client et se contente d'ajouter l'adresse
        # reelle a la fin. Le client pouvait ainsi declarer l'adresse de son
        # choix, ce qui neutralisait l'anti-force brute de la connexion admin
        # (verifie exploitable en Phase 6). Ici l'en-tete est REECRIT : il ne
        # contient que ce que nginx a constate.
        # Si un CDN est ajoute devant, revenir a $proxy_add_x_forwarded_for et
        # passer JARVIS_TRUSTED_PROXY_HOPS a 2.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Deuxieme ligne de defense, independante de l'application : meme si le
        # service redemarre et perd ses compteurs en memoire, nginx continue de
        # borner le debit. Declarer en amont, dans le bloc http :
        #   limit_req_zone $binary_remote_addr zone=jarvis:10m rate=30r/m;
        limit_req zone=jarvis burst=20 nodelay;

        # INDISPENSABLE pour le streaming SSE : sans cela nginx accumule la reponse
        # et la delivre d'un bloc a la fin, ce qui annule l'effet de streaming.
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;
    
        # Une reponse peut prendre quelques dizaines de secondes.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass         http://127.0.0.1:8501;
        proxy_http_version 1.1;

        # WebSocket requis par Streamlit
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        proxy_read_timeout 86400;
    }
}
