[server]
port = 8501
headless = true
address = "0.0.0.0"
enableCORS = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false
serverAddress = "climatsen.innosft.com"
serverPort = 443

[theme]
base = "light"
primaryColor = "#6366F1"
backgroundColor = "#F1F5F9"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"

[global]
# Jarvis regle les filtres du dashboard (navigate_dashboard, mode soutenance)
# en ecrivant st.session_state avant la creation des selecteurs. Sans cette
# option, Streamlit affiche un avertissement jaune dans la page pour chaque
# selecteur qui a aussi une valeur par defaut.
disableWidgetStateDuplicationWarning = true
